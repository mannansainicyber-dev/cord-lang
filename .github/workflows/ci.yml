name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run test suite
      run: |
        pytest -v

    - name: Verify CLI Commands
      run: |
        cord --version
        cord check examples/hello.cord
        cord check examples/slash-commands.cord
        cord check examples/moderation.cord
        cord check examples/embeds.cord
        cord check examples/interactive.cord
        cord check examples/economy.cord
