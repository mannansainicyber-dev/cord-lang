<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cordGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D28" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#262D3D" stroke-width="2" />

  <!-- Accent glow lines -->
  <path d="M 12 36 L 12 28 A 16 16 0 0 1 28 12 L 36 12" stroke="url(#cordGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 88 64 L 88 72 A 16 16 0 0 1 72 88 L 64 88" stroke="url(#cordGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Left Code Bracket '{' -->
  <path d="M 32 30 C 27 30 24 33 24 38 L 24 45 C 24 48 21 50 18 50 C 21 50 24 52 24 55 L 24 62 C 24 67 27 70 32 70" 
        stroke="#5865F2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Right Code Bracket '}' -->
  <path d="M 68 30 C 73 30 76 33 76 38 L 76 45 C 76 48 79 50 82 50 C 79 50 76 52 76 55 L 76 62 C 76 67 73 70 68 70" 
        stroke="#22C55E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Center Bot Core / Node -->
  <g transform="translate(50, 50)">
    <!-- Controller Head Outline -->
    <path d="M -15 -10 C -15 -14 -12 -16 -8 -16 L 8 -16 C 12 -16 15 -14 15 -10 L 17 8 C 17 13 13 16 9 16 C 6 16 4 14 3 11 L -3 11 C -4 14 -6 16 -9 16 C -13 16 -17 13 -17 8 Z"
          fill="#1E2536" stroke="#E2E8F0" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Bot Eyes / Controls -->
    <circle cx="-6.5" cy="-2" r="2.2" fill="#5865F2" />
    <circle cx="6.5" cy="-2" r="2.2" fill="#22C55E" />
    
    <!-- Sub-notch / D-pad hint -->
    <rect x="-3" y="4" width="6" height="2" rx="1" fill="#64748B" />
  </g>
</svg>
